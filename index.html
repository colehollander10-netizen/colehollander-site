<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Cole Hollander's useful links."
    />
    <meta name="theme-color" content="#f4f1eb" />
    <title>hi — Cole Hollander</title>
    <style>
      :root {
        color-scheme: light;
        --background: #f4f1eb;
        --foreground: #24231f;
        --muted: #77736b;
        --line: #d8d3c9;
        --focus: #9d4d32;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        background: var(--background);
      }

      body {
        min-height: 100svh;
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      main {
        display: flex;
        min-height: 100svh;
        width: min(100% - 3rem, 38rem);
        margin: 0 auto;
        padding: 3rem 0;
        flex-direction: column;
        justify-content: center;
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(5rem, 17vw, 9rem);
        font-weight: 400;
        letter-spacing: -0.09em;
        line-height: 0.78;
      }

      .intro {
        margin: 1.25rem 0 0;
        color: var(--muted);
        font-size: 0.875rem;
        letter-spacing: 0.02em;
      }

      nav {
        margin-top: 5rem;
      }

      nav a {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-top: 1px solid var(--line);
        padding: 1rem 0;
        color: var(--foreground);
        font-size: 1.05rem;
        text-decoration: none;
        transition: color 160ms ease, padding 160ms ease;
      }

      nav a:last-child {
        border-bottom: 1px solid var(--line);
      }

      nav a::after {
        color: var(--muted);
        content: "↗";
        font-size: 1rem;
        transition: transform 160ms ease, color 160ms ease;
      }

      nav a:hover {
        color: var(--focus);
        padding-left: 0.35rem;
      }

      nav a:hover::after {
        color: var(--focus);
        transform: translate(0.15rem, -0.15rem);
      }

      nav a:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 0.35rem;
      }

      @media (max-width: 30rem) {
        main {
          width: min(100% - 2rem, 38rem);
          padding: 2rem 0;
        }

        nav {
          margin-top: 4rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        nav a,
        nav a::after {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <h1>hi</h1>
        <p class="intro">Cole Hollander</p>

        <nav aria-label="Useful links">
          <a href="https://github.com/colehollander10-netizen">GitHub</a>
          <a href="https://www.linkedin.com/in/colehollander">LinkedIn</a>
          <a href="https://x.com/colehollander">X</a>
          <a href="https://colehollander.substack.com">Substack</a>
        </nav>
      </div>
    </main>
  </body>
</html>
